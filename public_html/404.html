<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/navdiva-logo.png">
  <title>404 - Page Not Found | Navdiva Group</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
  <script src="js/navdiva-footer.js" defer></script>
  <style>
    .not-found-wrapper {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
    }
    .not-found-code {
      font-size: clamp(5rem, 12vw, 8rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--cyan-electric) 0%, var(--purple-neon) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      line-height: 1;
      filter: drop-shadow(0 0 30px rgba(0, 184, 255, 0.4));
    }
    .not-found-title {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #fff;
    }
    .not-found-desc {
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <!-- 2026-era Liquid Glass Bento Navbar -->
  <header class="site-header">
    <nav class="bento-navbar">
      <a href="./" class="nav-brand">
        <img src="images/navdiva-logo.png" alt="Navdiva Group Logo" class="nav-logo">
        <span class="brand-text"><span>NAV</span><span class="cyan">DIVA</span></span>
      </a>
      <button class="mobile-toggle" aria-label="Toggle navigation">☰</button>
      <ul class="nav-links">
        <li><a data-page="index" href="./">Home</a></li>
        <li><a data-page="about" href="about.html">About</a></li>
        <li><a data-page="units" href="units.html">Portfolio</a></li>
        <li><a data-page="ceo" href="ceo.html">Leadership</a></li>
        <li><a data-page="careers" href="careers.html">Careers</a></li>
        <li><a data-page="press" href="press.html">Press</a></li>
        <li><a data-page="contact" href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-cta">
        <a href="contact.html" class="nav-cta-btn">Get In Touch ↗</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="not-found-wrapper">
      <div class="not-found-code">404</div>
      <h1 class="not-found-title">Page Not Found</h1>
      <p class="not-found-desc">The page or resource you are looking for has been moved, renamed, or is unavailable in our updated 2026 directory.</p>
      <a href="./" class="btn btn-primary" style="padding: 14px 32px; font-size: 1rem;">
        ← Return to Home Portal
      </a>
    </div>
  </main>

  <!-- Custom Web Component Footer -->
  <navdiva-footer></navdiva-footer>
  <div class="toast"></div>

</body>
</html>
